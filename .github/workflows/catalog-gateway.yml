name: PocketBase catalog gateway
on:
  push:
    paths: ['pb_hooks/**', 'tests/gateway/**', '.github/workflows/catalog-gateway.yml']
  pull_request:
    paths: ['pb_hooks/**', 'tests/gateway/**', '.github/workflows/catalog-gateway.yml']
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/gateway/*.test.cjs
