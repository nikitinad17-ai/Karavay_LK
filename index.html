  --gray-400:#8A94A6;
  --gray-600:#4B5468;
  --ink:#1A1F2C;
  --success:#178A3C;
  --warn:#B26A00;
  --danger:#B3261E;

  --radius:12px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(15,36,85,.06),0 1px 3px rgba(15,36,85,.08);
  --shadow-md:0 6px 20px rgba(15,36,85,.10);
  --shadow-lg:0 20px 50px rgba(15,36,85,.18);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw}
img,svg,video,canvas,table{max-width:100%}
body{
  font-family:'Noto Sans','Ubuntu',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);
  background:var(--gray-50);
  font-size:15px;
}
h1,h2,h3,h4,.sidebar__logo-title,.login__slogan,.login__title{font-family:'Ubuntu','Noto Sans',sans-serif}
body{
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ------- LOGIN ------- */
.login{
  min-height:100vh;
  display:grid;
  grid-template-columns:1.05fr 1fr;
  background:var(--blue);
}
.login__hero{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px;
  color:var(--white);
}
.login__hero-inner{position:relative;text-align:center;max-width:520px}
.login__logo-circle{
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;
}
.login__logo-circle img,
.login__logo-circle svg{width:200px;height:auto;display:block}
.login__site-link{display:inline-block;color:rgba(255,255,255,.75);font-size:14px;text-decoration:none;margin:0 auto 24px;padding:4px 10px;border-radius:6px;transition:color .15s,background .15s}
.login__site-link:hover{color:#fff;background:rgba(255,255,255,.08);text-decoration:underline}
/* v1.5.5: ссылка перемещена в низ под подзаголовок */
.login__site-link--bottom{margin:28px auto 0}
.nowrap{white-space:nowrap}
.login__slogan{
  font-size:44px;line-height:1.05;font-weight:700;
  letter-spacing:.5px;margin:0 0 16px;
  text-transform:uppercase;
}
.login__slogan .accent{color:var(--yellow)}
.login__lead{font-size:17px;opacity:.85;margin:0}

.login__form-side{
  background:var(--white);
  display:flex;align-items:center;justify-content:center;
  padding:48px;
}
.login__form-card{width:100%;max-width:420px}
.login__title{
  font-size:28px;font-weight:700;margin:0 0 8px;color:var(--blue-ink);
}
.login__sub{margin:0 0 32px;color:var(--gray-600)}
.login__field{margin-bottom:18px}
.login__field label{
  display:block;font-size:13px;font-weight:500;color:var(--gray-600);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;
}
.login__field input{
  width:100%;height:48px;border:1.5px solid var(--gray-200);
  border-radius:var(--radius);padding:0 14px;font-size:16px;
  font-family:inherit;background:var(--white);
  transition:border-color .15s, box-shadow .15s;
}
.login__field input:focus{
  outline:none;border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(26,58,143,.12);
}
.login__error{
  background:#FEECEA;color:var(--danger);
  padding:10px 14px;border-radius:var(--radius);
  font-size:14px;margin-bottom:16px;
}
.login__submit{
  width:100%;height:52px;background:var(--blue);color:var(--white);
  border:none;border-radius:var(--radius);
  font-size:16px;font-weight:600;letter-spacing:.3px;
  cursor:pointer;transition:background .15s, transform .05s;
}
.login__submit:hover{background:var(--blue-deep)}
.login__submit:active{transform:translateY(1px)}
.login__hint{
  margin-top:24px;padding:14px 16px;
  background:var(--blue-soft);border-radius:var(--radius);
  font-size:13px;color:var(--blue-ink);
}
.login__hint strong{color:var(--blue)}
.login__remember{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--blue-ink);margin:-4px 0 16px;cursor:pointer;user-select:none}
.login__remember input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
.login__trusted{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 12px 24px;margin-bottom:20px;background:var(--blue-soft);border-radius:var(--radius);border:1px solid rgba(4,63,136,.12)}
.login__trusted-avatar{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Ubuntu',sans-serif;font-weight:700;font-size:20px;letter-spacing:.5px;margin-bottom:12px}
.login__trusted-name{font-family:'Ubuntu',sans-serif;font-weight:700;font-size:18px;color:var(--blue-ink);margin-bottom:4px}
.login__trusted-code{font-size:13px;color:var(--muted)}
.login__trusted-code strong{color:var(--blue-ink);font-weight:600}
.login__switch{margin-top:12px;background:transparent;border:none;color:var(--blue);font-size:14px;cursor:pointer;padding:8px;text-decoration:underline;text-underline-offset:3px;width:100%}
.login__switch:hover{color:var(--blue-deep)}

@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login__hero{min-height:280px;padding:32px}
  .login__logo-circle img,
  .login__logo-circle svg{width:140px}
  .login__slogan{font-size:28px}
  .login__form-side{padding:32px 20px}
}

/* ------- APP LAYOUT ------- */
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}
.sidebar{
  background:var(--blue);
  color:var(--white);
  padding:24px 0;
  position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;
}
.sidebar__logo{
  padding:0 20px 20px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:16px;
}
.sidebar__logo-img{width:56px!important;height:56px!important;flex-shrink:0;display:block;max-width:56px}
.sidebar__logo-title{color:#fff;font-weight:700;font-size:18px;line-height:1;letter-spacing:.02em}
.sidebar__logo-sub{color:rgba(255,255,255,.65);font-size:11px;margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
/* v1.5.5: ссылка в подвале сайдбара (под кнопкой «Выйти») */
.sidebar__site-link{display:block;text-align:center;color:rgba(255,255,255,.55);font-size:11px;padding:12px 0 4px;text-decoration:none;transition:color .15s}
.sidebar__site-link:hover{color:rgba(255,255,255,.85);text-decoration:underline}
.sidebar__nav{list-style:none;margin:0;padding:0 12px;flex:1}
.sidebar__nav li{margin:2px 0}
.sidebar__nav a{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:10px;
  color:rgba(255,255,255,.85);text-decoration:none;
  font-weight:500;font-size:15px;
  transition:background .15s, color .15s;
}
.sidebar__nav a:hover{background:rgba(255,255,255,.08);color:var(--white)}
.sidebar__nav a.active{background:var(--yellow);color:var(--blue-ink)}
.sidebar__nav .badge{
  margin-left:auto;background:var(--yellow);color:var(--blue-ink);
  padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;
}
.sidebar__nav a.active .badge{background:var(--blue);color:var(--white)}
.sidebar__foot{
  padding:16px 20px;border-top:1px solid rgba(255,255,255,.12);
  font-size:12px;color:rgba(255,255,255,.6);
}
/* v1.3: контакт стола заказов */
.sidebar__contact{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:10px;padding:10px 12px;margin-bottom:12px;
}
.sidebar__contact-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--yellow);font-weight:700;margin-bottom:6px}
.sidebar__contact-line{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);margin-top:3px}
.sidebar__contact-line a{color:var(--yellow);text-decoration:none;font-weight:600}
.sidebar__contact-line a:hover{text-decoration:underline}
.sidebar__foot button{
  width:100%;background:transparent;border:1px solid rgba(255,255,255,.25);
  color:var(--white);padding:8px 12px;border-radius:8px;
  font-size:13px;cursor:pointer;margin-top:8px;
}
.sidebar__foot button:hover{background:rgba(255,255,255,.08)}

.main{padding:0}
.topbar{
  height:72px;background:var(--white);border-bottom:1px solid var(--blue-line);
  padding:0 32px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:10;
}
.topbar__title{font-size:22px;font-weight:700;color:var(--blue-ink);margin:0}
.topbar__spacer{flex:1}
.topbar__user{
  display:flex;align-items:center;gap:12px;padding:6px 12px;
  border-radius:10px;background:var(--gray-100);
}
.topbar__user-name{font-weight:600;font-size:14px}
.topbar__user-code{font-size:12px;color:var(--gray-600)}
.avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--blue);color:var(--yellow);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;
}

.content{padding:28px 32px 60px;max-width:1200px}
/* v1.8: страница заказа растягивается на всю ширину, чтобы каталог был пошире */
.content--wide{max-width:1600px}
@media (min-width:1600px){.content--wide{max-width:1800px}}
@media (min-width:1920px){.content--wide{max-width:2000px}}

/* ------- CARDS ------- */
.card{
  background:var(--white);border-radius:var(--radius-lg);
  border:1px solid var(--blue-line);
  box-shadow:var(--shadow-sm);
  padding:22px;
}
.card + .card{margin-top:20px}
.card__title{
  font-size:16px;font-weight:700;color:var(--blue-ink);
  margin:0 0 16px;text-transform:uppercase;letter-spacing:.4px;
}
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1000px){
  .grid-3,.grid-4{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
}

/* KPI */
.kpi{
  background:var(--white);border-radius:var(--radius-lg);
  padding:20px 22px;border:1px solid var(--blue-line);
  position:relative;overflow:hidden;
}
.kpi__label{font-size:12px;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.kpi__value{font-size:32px;font-weight:700;color:var(--blue-ink);line-height:1}
.kpi__hint{font-size:13px;color:var(--gray-600);margin-top:6px}
.kpi--accent{background:var(--blue);color:var(--white);border-color:var(--blue)}
.kpi--accent .kpi__label{color:rgba(255,255,255,.75)}
.kpi--accent .kpi__value{color:var(--yellow)}
.kpi--accent .kpi__hint{color:rgba(255,255,255,.8)}

/* Hero block */
.hero-card{
  background:linear-gradient(120deg,var(--blue) 0%,var(--blue-deep) 100%);
  color:var(--white);border-radius:var(--radius-lg);
  padding:24px 28px;position:relative;overflow:hidden;
  border:1px solid var(--blue-deep);
}
.hero-card::after{
  content:'';position:absolute;right:-40px;top:-40px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle at center,var(--yellow) 0%,var(--yellow) 40%,transparent 70%);
  opacity:.18;
}
.hero-card h2{margin:0 0 6px;font-size:24px;font-weight:700}
.hero-card p{margin:0;opacity:.9;font-size:15px}
.hero-card .actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:10px;
  font-weight:600;font-size:14px;cursor:pointer;
  border:1.5px solid transparent;font-family:inherit;
  transition:background .15s,color .15s,border-color .15s,transform .05s;
}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--yellow);color:var(--blue-ink);border-color:var(--yellow)}
.btn--primary:hover{background:#FFDE33;text-decoration:none}
.btn--blue{background:var(--blue);color:var(--white);border-color:var(--blue)}
.btn--blue:hover{background:var(--blue-deep);text-decoration:none}
.btn--ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,.5)}
.btn--ghost:hover{background:rgba(255,255,255,.1);text-decoration:none}
.btn--secondary{background:var(--white);color:var(--blue);border-color:var(--blue-line)}
.btn--secondary:hover{border-color:var(--blue);background:var(--blue-soft);text-decoration:none}
.btn--sm{padding:6px 12px;font-size:13px}
.btn--icon-only{padding:8px;width:36px;height:36px;justify-content:center}

/* Table */
.table{
  width:100%;border-collapse:collapse;font-size:14px;
}
.table th{
  text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--gray-600);font-weight:600;padding:12px 14px;
  border-bottom:1.5px solid var(--blue-line);
}
.table td{padding:14px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.table tbody tr:hover{background:var(--gray-50);cursor:pointer}
.table tbody tr:last-child td{border-bottom:none}

/* Status pill */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:20px;
  font-size:12px;font-weight:600;
}
.pill--accepted{background:#FFF3B0;color:#8A6100}
.pill--picked{background:#DBE7FF;color:#204389}
.pill--shipped{background:#CDE8FF;color:#0F5B96}
.pill--delivered{background:#DCF3E1;color:#0F6E2A}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}

/* Badge */
.badge-tag{
  display:inline-block;padding:3px 10px;border-radius:12px;
  background:var(--blue-soft);color:var(--blue-ink);
  font-size:12px;font-weight:500;margin-right:6px;
}

/* Order builder */
/* v1.5.7: фиксированная ширина правой колонки «В заказе» (340px), чтобы каталог и summary не прыгали при смене фильтра */
/* v2.2: категории теперь строкой чипсов над каталогом — колонка фильтров убрана, две колонки: каталог · сводка */
.order-form{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.order-form > *{min-width:0}
@media (min-width:1600px){.order-form{grid-template-columns:minmax(0,1fr) 350px}}
/* ≤1000: одна колонка, сводка уходит под каталог */
@media (max-width:1000px){
  .order-form{grid-template-columns:1fr}
}
.product-list{max-height:clamp(460px, calc(100vh - 300px), 980px);overflow-y:auto;border:1px solid var(--blue-line);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:8px}
/* v1.5.4: sticky-шапка каталога (колонки Лотки/Штук/Итого) */
.product-list-header{
  display:flex;align-items:center;
  padding:10px 20px 10px 16px;background:var(--blue-soft);
  border:1px solid var(--blue-line);border-bottom:1px solid var(--blue-line);
  border-radius:var(--radius) var(--radius) 0 0;
  font-size:11px;font-weight:700;color:var(--blue-ink);
  text-transform:uppercase;letter-spacing:.4px;
  position:sticky;top:72px;z-index:5;
}
.plh__name{flex:1;min-width:0}
.plh__price{text-align:right;min-width:120px;padding-right:16px}
.plh__col{width:88px;text-align:center;flex-shrink:0}
.plh__col + .plh__col{margin-left:10px}
.product{
  display:flex;align-items:center;gap:12px;padding:10px;
  border-radius:10px;transition:background .15s;
}
.product:hover{background:var(--blue-soft)}
.product__name{flex:1;font-weight:500;overflow-wrap:break-word;word-break:break-word;line-height:1.35}
.product__unit{color:var(--gray-600);font-size:13px;min-width:36px}
.qty{
  display:flex;align-items:center;gap:0;
  border:1.5px solid var(--gray-200);border-radius:10px;overflow:hidden;
}
.qty button{
  width:32px;height:32px;background:var(--white);border:none;
  cursor:pointer;font-size:18px;color:var(--blue);font-weight:700;
}
.qty button:hover{background:var(--blue-soft)}
.qty input{
  width:56px;height:32px;border:none;text-align:center;
  font-size:14px;font-weight:600;font-family:inherit;
}
.qty input:focus{outline:none;background:var(--yellow-soft)}

/* v1.3: двойной ввод «Лотки / Шт.» в карточке товара */
.qty--dual{display:flex;flex-direction:column;gap:6px;border:none;overflow:visible;align-items:stretch}
.qty--dual .qty__field{display:flex;flex-direction:column;gap:2px}
.qty--dual .qty__label{font-size:10px;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.qty--dual .qty__stepper{display:flex;align-items:center;border:1.5px solid var(--gray-200);border-radius:10px;overflow:hidden}
.qty--dual .qty__stepper button{width:30px;height:30px;background:var(--white);border:none;cursor:pointer;font-size:16px;color:var(--blue);font-weight:700}
.qty--dual .qty__stepper button:hover{background:var(--blue-soft)}
.qty--dual .qty__stepper input{width:52px;height:30px;border:none;text-align:center;font-size:14px;font-weight:600;font-family:inherit}
.qty--dual .qty__field > input{width:100%;height:30px;border:1.5px solid var(--gray-200);border-radius:10px;text-align:center;font-size:14px;font-weight:600;font-family:inherit}
.qty--dual .qty__field > input:focus{outline:none;background:var(--yellow-soft)}

/* qty--lotonly — товар продаётся только лотками: ввод лотков + итого шт. (только чтение), в одну строку */
/* v1.5.4: 3 колонки по 88px (лотки/штуки/итого), gap 10px — выравнивание с .plh__col */
.qty--lotonly{display:grid;grid-template-columns:88px 88px 88px;gap:10px;align-items:center;border:none;overflow:visible;flex-shrink:0}
.qty--lotonly.qty--2col .qty__field:last-child{grid-column:3}
.qty--lotonly .qty__field{display:flex;flex-direction:column;gap:0}
.qty--lotonly .qty__field--empty{visibility:hidden}
.qty--lotonly .qty__stepper{display:flex;align-items:stretch;width:88px;height:32px;border:1.5px solid var(--gray-200);border-radius:10px;overflow:hidden;background:var(--white)}
.qty--lotonly .qty__stepper .qty__btn{width:26px;flex-shrink:0;background:var(--gray-50);border:none;cursor:pointer;font-size:16px;line-height:1;color:var(--blue);font-weight:700;font-family:inherit;padding:0;display:flex;align-items:center;justify-content:center;user-select:none}
.qty--lotonly .qty__stepper .qty__btn:hover{background:var(--blue-soft);color:var(--blue-ink)}
.qty--lotonly .qty__stepper .qty__btn:active{background:var(--blue);color:#fff}
.qty--lotonly .qty__stepper input{flex:1;min-width:0;height:100%;border:none;text-align:center;font-size:14px;font-weight:600;font-family:inherit;background:transparent;-moz-appearance:textfield}
.qty--lotonly .qty__stepper input::-webkit-outer-spin-button,
.qty--lotonly .qty__stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty--lotonly .qty__stepper input:focus{outline:none;background:var(--yellow-soft)}
.qty--lotonly .qty__total{width:88px;height:32px;border:1.5px solid var(--gray-100);border-radius:10px;background:var(--gray-50);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--blue-ink);font-variant-numeric:tabular-nums}
/* v2.2: подписи «лотки/штуки/итого шт» под степперами в модалке заказа (там нет отдельных заголовков колонок) */
.qty__field-label{font-size:10px;color:var(--gray-600);text-align:center;margin-top:3px}
.qty--lotonly .qty__lotsize{font-size:10px;color:var(--gray-500);white-space:nowrap;margin-bottom:6px}

/* v1.3: акционные товары */
.promo-tag{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.3px;flex-shrink:0}
.product--promo{background:rgba(255,235,235,.35)}
.product--promo:hover{background:rgba(255,225,225,.5)}
.price{font-weight:700;color:var(--blue-ink)}
.price--promo{color:var(--danger)}
.price-old{font-size:12px;color:var(--gray-400);text-decoration:line-through}

/* v1.3: фильтр каталога */
.summary__totals{margin-bottom:16px}
.summary__error{color:var(--danger);font-size:13px;margin-top:8px;font-weight:500}

.summary__list{margin:0 0 16px;padding:0;list-style:none;max-height:280px;overflow:auto}
.summary__list li{
  display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
  padding:10px 0;border-bottom:1px dashed var(--blue-line);
  font-size:14px;
}
.summary__list li:last-child{border-bottom:none}
.summary__list .name{font-weight:500;line-height:1.35}
.summary__list .q{color:var(--blue);font-weight:600}
.summary__list .qty--sm{gap:4px}
.summary__list .qty--sm .qty__btn{width:26px;height:26px;font-size:15px}
.summary__del:hover{color:var(--red) !important}
.summary__empty{color:var(--gray-600);font-size:14px;padding:14px 0}
.summary__total{
  background:var(--yellow-soft);border-radius:10px;padding:12px 14px;
  display:flex;justify-content:space-between;font-weight:700;
  color:var(--blue-ink);margin-bottom:16px;
}
.summary__field{margin-bottom:12px}
.summary__field label{font-size:12px;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.summary__field input,.summary__field textarea{
  width:100%;border:1.5px solid var(--gray-200);border-radius:10px;
  padding:10px 12px;font-size:14px;font-family:inherit;
  color:var(--ink);
}
.summary__field input[type=date]{text-align:left}
.summary__field textarea{min-height:70px;resize:vertical}
.summary__field input:focus,.summary__field textarea:focus{
  outline:none;border-color:var(--blue);
}

/* Messages */


/* Doc list */
.doclist{list-style:none;margin:0;padding:0}
.doclist li{
  display:flex;align-items:center;gap:14px;
  padding:14px;border-bottom:1px solid var(--gray-100);
}
.doclist li:last-child{border-bottom:none}
.doclist__icon{
  width:40px;height:40px;border-radius:10px;
  background:var(--blue-soft);color:var(--blue);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.doclist__info{flex:1}
.doclist__title{font-weight:600;color:var(--blue-ink)}
.doclist__meta{font-size:13px;color:var(--gray-600)}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--blue-ink);color:var(--white);
  padding:14px 22px;border-radius:12px;box-shadow:var(--shadow-lg);
  z-index:1000;font-size:14px;font-weight:500;
  animation:toast-in .25s ease-out;
}
.toast--success{background:var(--success)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Empty */
.empty{padding:40px 20px;text-align:center;color:var(--gray-600)}
.empty__icon{width:60px;height:60px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}

/* Order details modal */
.modal-back{
  position:fixed;inset:0;background:rgba(15,36,85,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{
  background:var(--white);border-radius:var(--radius-lg);
  max-width:700px;width:100%;max-height:90vh;overflow:auto;
  box-shadow:var(--shadow-lg);
}
.modal__header{
  padding:20px 24px;border-bottom:1px solid var(--blue-line);
  display:flex;align-items:center;gap:12px;
  background:var(--blue);color:var(--white);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
}
.modal__header h3{margin:0;font-size:18px;flex:1}
.modal__close{
  background:transparent;border:none;color:var(--white);
  width:32px;height:32px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.modal__close:hover{background:rgba(255,255,255,.15)}
.modal__body{padding:24px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:14px;margin-bottom:16px}
.dl dt{color:var(--gray-600)}
.dl dd{margin:0;font-weight:500}

/* Loader */
.loader{
  display:inline-block;width:20px;height:20px;
  border:2.5px solid rgba(26,58,143,.2);
  border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.page-loader{padding:60px;text-align:center}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:-280px;width:260px;transition:left .2s;z-index:100}
  .sidebar.open{left:0}
  .topbar{padding:0 16px}
  .content{padding:20px 16px 60px}
}
.menu-toggle{display:none;background:transparent;border:none;cursor:pointer;padding:8px}
@media (max-width:820px){.menu-toggle{display:block}}

/* Затемнение под сайдбаром на мобильных: клик по нему закрывает меню */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(4,17,44,.45);
  z-index:90;animation:fadeIn .15s ease;
}
.sidebar-overlay.is-visible{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* v1.2: компактная плашка выбранной точки в шапке на мобильных ---------------- */
@media (max-width:768px){
  /* v1.2 mobile fixes */
  .content{padding:16px 12px 60px;max-width:100vw;overflow-x:hidden}
  .card{padding:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .kpi__value{font-size:24px;word-break:break-word}
  .hero-card{padding:20px}
  .hero-card h2{font-size:20px}

  /* Таблицы в карточках → горизонтальный скролл в контейнере */
  .table{font-size:12px;min-width:520px}
  .table th,.table td{padding:10px 8px;white-space:nowrap}

  /* Каталог: чипы категорий — горизонтальный скролл */
  /* v1.6-A: каталог grid-layout — правила .product/.qty/.product__name вынесены в отдельный @media (max-width:820px) в конце файла */

  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:8px;font-weight:600;font-size:12px;color:var(--gray-600)}
  /* прячем данные покупателя (юрлицо, код, роль) в шапке */
  .topbar__user{display:none}
  .topbar__title{display:none}
}

/* v1.2: конфирм-модалка в фирменных цветах --------------------------------- */
.confirm-back{
  position:fixed;inset:0;background:rgba(4,17,44,.55);
  z-index:200;display:flex;align-items:center;justify-content:center;
  padding:20px;animation:fadeIn .12s ease;
}
.confirm-modal{
  background:#fff;border-radius:16px;
  max-width:440px;width:100%;
  box-shadow:0 20px 60px rgba(4,17,44,.35);
  overflow:hidden;animation:confirmIn .18s ease;
}
@keyframes confirmIn{
  from{transform:translateY(8px) scale(.98);opacity:0}
  to{transform:none;opacity:1}
}
.confirm-modal__head{
  padding:20px 24px 6px;
  font-size:18px;font-weight:700;color:var(--blue-ink);
  font-family:'Ubuntu','Noto Sans',sans-serif;
}
.confirm-modal__body{
  padding:6px 24px 20px;color:var(--gray-600);font-size:14px;line-height:1.55;
}
.confirm-modal__body strong{color:var(--blue-ink)}
.confirm-modal__foot{
  padding:14px 24px;background:#F7F9FC;
  border-top:1px solid var(--gray-100);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
}
.confirm-modal__foot .btn{min-width:110px;justify-content:center}

/* красная кнопка опасного действия */
.btn--danger{
  background:#B71C1C;color:#fff;border-color:#B71C1C;
}
.btn--danger:hover{background:#8E1414;border-color:#8E1414;color:#fff;text-decoration:none}
.btn--danger-outline{
  background:#fff;color:#B71C1C;border-color:#F5C6C0;
}
.btn--danger-outline:hover{background:#FDECEA;border-color:#E4A3A0;text-decoration:none}

@media (max-width:480px){
  .confirm-modal__foot{flex-direction:column-reverse}
  .confirm-modal__foot .btn{width:100%}
}

/* ============ v1.1: Отгрузка, сальдо, точки, hold ============ */

/* Pill статус заказа: hold, cancelled */
.pill--hold{background:#FFE0B2;color:#8A4A00}
.pill--cancelled{background:#EEE;color:#666}

/* Ship-pill — статус отгрузки */
.ship-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:600;letter-spacing:.2px;
  background:#E8F5E9;color:#1B5E20;
  border:1px solid rgba(0,0,0,.05);
}
.ship-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.ship--ok{background:#E8F5E9;color:#1B5E20}
.ship--blocked{background:#FDECEA;color:#B71C1C}
.ship--balance-ok{background:#E3F2FD;color:#0D47A1}
.ship--balance-stop{background:#FFF3E0;color:#B26A00}

/* На синей hero-карточке — прозрачный фон */
.hero-card .ship-pill,.hero-card .bal-pill,.hero-card .edi-pill{
  background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.25)
}

/* Edi-pill — код клиента в системе ЭДО */
.edi-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:600;letter-spacing:.2px;
  background:#E8F5E9;color:#1B5E20;
  border:1px solid rgba(0,0,0,.05);
  font-family:'Ubuntu Mono',monospace;
}

/* Bal-pill — сальдо */
.bal-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:600;
  background:#F1F3F5;color:#333;
  border:1px solid rgba(0,0,0,.05);
  font-variant-numeric:tabular-nums;
}
.bal--pos{background:#E8F5E9;color:#1B5E20}
.bal--neg{background:#FDECEA;color:#B71C1C}
.bal--zero{background:#F1F3F5;color:#555}

/* Баннеры */
.banner{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;border-radius:12px;
  margin:0 0 16px;font-size:14px;line-height:1.5;
  border:1px solid transparent;
}
.banner strong{display:block;margin-bottom:2px;font-size:14px}
.banner--warn{background:#FFF4E5;color:#7A4A00;border-color:#FFE0B2}
.banner--info{background:#E3F2FD;color:#0D47A1;border-color:#BBDEFB}
.banner--hold{background:#FDECEA;color:#8A1B14;border-color:#F5C6C0}
.banner--warn::before{content:'⚠';font-size:18px;line-height:1.2}
.banner--info::before{content:'ℹ';font-size:18px;line-height:1.2}
.banner--hold::before{content:'⏸';font-size:18px;line-height:1.2}

/* Карточки точек в разделе "Мои точки" */
.outlet-card{
  background:#fff;border-radius:14px;padding:20px;
  border:1px solid var(--gray-200);
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  transition:box-shadow .2s ease;
}
.outlet-card:hover{box-shadow:0 4px 12px rgba(4,63,136,.08)}
.outlet-card--current{border-color:var(--blue);box-shadow:0 4px 12px rgba(4,63,136,.12)}
.outlet-card__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.outlet-card__code{font-family:'Ubuntu Mono',monospace;font-size:12px;color:var(--gray-600);background:#F8F9FA;padding:3px 8px;border-radius:6px}
.outlet-card__name{margin:0 0 4px;font-size:17px;font-weight:600;color:#111}
.outlet-card__addr{margin:0 0 14px;color:var(--gray-600);font-size:13px;line-height:1.5}
.outlet-card__grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px 20px;padding-top:14px;border-top:1px solid var(--gray-100);
}
.outlet-card__label{font-size:11px;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:4px}
.outlet-card__val{font-size:14px;color:#111;font-weight:500;line-height:1.4}
.outlet-card__sub{font-size:12px;color:var(--gray-600);margin-top:2px}
.outlet-card__current-tag{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--blue);color:#fff;
  padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;
}

/* v1.3: компактный список получателей в профиле */
.recipient-list{display:flex;flex-direction:column;gap:8px}
.recipient-row{
  display:flex;align-items:center;gap:16px;
  border:1px solid var(--gray-200);border-radius:12px;
  padding:12px 14px;cursor:pointer;transition:background .15s,border-color .15s;
}
.recipient-row:hover{background:var(--blue-soft);border-color:var(--blue)}
.recipient-row--current{border-color:var(--blue);background:rgba(0,102,204,.04)}
.recipient-row__main{flex:1;min-width:0}
.recipient-row__name{font-weight:600;font-size:15px;color:#111}
.recipient-row__code{font-family:'Ubuntu Mono',monospace;font-size:12px;color:var(--gray-600);background:#F8F9FA;padding:2px 7px;border-radius:6px;margin-left:6px}
.recipient-row__addr{font-size:12px;color:var(--gray-600);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recipient-row__last{min-width:150px;text-align:right}
.recipient-row__label{font-size:10px;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:3px}
.recipient-row__date{font-size:13px;font-weight:600;color:var(--blue-ink);margin-bottom:3px}
.recipient-row__none{font-size:13px;color:var(--gray-500,#9AA3AD)}
.recipient-row__go{color:var(--gray-400);display:flex;align-items:center;transition:transform .15s}
.recipient-row__go--open{transform:rotate(90deg)}
.recipient-row--open{border-color:var(--blue);background:rgba(0,102,204,.04)}
.recipient-detail{margin:-2px 0 8px;animation:recipient-detail-in .15s ease-out}
@keyframes recipient-detail-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:640px){
  .recipient-row{flex-wrap:wrap;gap:8px}
  .recipient-row__last{min-width:0;text-align:left;width:100%}
}

/* Форма редактирования минималки прямо в карточке */
.outlet-card form{
  display:flex;gap:8px;align-items:center;margin-top:6px;
}
.outlet-card form input{
  width:110px;padding:6px 10px;border:1px solid var(--gray-200);border-radius:8px;
  font-family:inherit;font-size:14px;font-variant-numeric:tabular-nums;
}
.outlet-card form input:focus{outline:none;border-color:var(--blue)}
.outlet-card form button{
  padding:6px 12px;font-size:13px;
}

/* Строка ship-status в summary */
.ship-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.summary__ship{
  padding:10px 12px;border-radius:10px;background:#F8F9FA;
  border:1px solid var(--gray-200);margin-bottom:12px;
  font-size:13px;
}
.summary__min{
  padding:10px 12px;border-radius:10px;
  background:#FFF4E5;border:1px solid #FFE0B2;color:#7A4A00;
  font-size:13px;margin-bottom:12px;
}
.summary__min strong{display:block;margin-bottom:2px}
.summary__error{
  padding:10px 12px;border-radius:10px;
  background:#FDECEA;border:1px solid #F5C6C0;color:#8A1B14;
  font-size:13px;margin-bottom:12px;font-weight:500;
}

/* Toast с ошибкой */
.toast--error{background:#B71C1C}

/* KPI акцент */
.kpi--accent{background:linear-gradient(135deg,#043F88 0%,#0654B0 100%);color:#fff;border-color:transparent}
.kpi--accent .kpi__label,.kpi--accent .kpi__hint{color:rgba(255,255,255,.85)}
.kpi--accent .kpi__value{color:#fff}

/* Информационные dl-строки в профиле */
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.dl dt{color:var(--gray-600);font-size:13px}
.dl dd{margin:0;font-size:14px;font-weight:500;color:#111}


/* Баннер отсутствия договора */
.banner--no-contract{
  background:#FDECEA;color:#8A1B14;border-color:#F5C6C0;
}
.banner--no-contract::before{content:'\26d4';font-size:18px;line-height:1.2}

/* ============ v1.9: плашка точки, панель фильтров, каталог ============ */

/* Синяя плашка выбора точки — под шапкой */
.outlet-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--blue);color:#fff;
  border-radius:var(--radius);padding:10px 16px;margin-bottom:18px;
}
.outlet-bar__tag{
  font-size:11px;font-weight:700;letter-spacing:.8px;
  background:rgba(255,255,255,.18);padding:3px 9px;border-radius:6px;flex-shrink:0;
}
.outlet-bar__select{
  flex:1;min-width:200px;max-width:680px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);
  color:#fff;font-family:inherit;font-size:14px;font-weight:600;
  border-radius:8px;padding:7px 10px;cursor:pointer;outline:none;
}
.outlet-bar__select:focus{border-color:#fff;background:rgba(255,255,255,.2)}
.outlet-bar__select option{color:#111;background:#fff;font-weight:500}
.outlet-bar__static{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px;min-width:0}
.outlet-bar__code{font-family:'Ubuntu Mono',monospace;font-size:12px;opacity:.85}
.outlet-bar__addr{font-size:13px;opacity:.85}

.kpi--link{cursor:pointer;transition:box-shadow .15s ease,border-color .15s ease}
.kpi--link:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(4,63,136,.10)}

/* Код точки в плашке приветствия и в таблицах */
.hero-card__code{
  font-family:'Ubuntu Mono',monospace;font-size:12px;
  background:rgba(255,255,255,.18);padding:2px 7px;border-radius:6px;
  margin-left:4px;
}
.cell-code{
  font-family:'Ubuntu Mono',monospace;font-size:12px;color:var(--gray-600);
}

/* v2.0: панель параметров заказа — группа и дата поставки */
.order-params{
  display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  background:var(--white);border:1px solid var(--blue-line);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;
}
.order-params__item{display:flex;flex-direction:column;gap:6px}
.order-params__label{
  font-size:11px;color:var(--gray-600);text-transform:uppercase;
  letter-spacing:.4px;font-weight:600;
}
.order-params__select{
  padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:10px;
  font-family:inherit;font-size:14px;font-weight:600;color:var(--blue-ink);
  min-width:210px;cursor:pointer;background:var(--white);
}
.order-params__select:focus{outline:none;border-color:var(--blue)}
.order-params__note{
  margin-left:auto;font-size:13px;color:var(--gray-600);
  align-self:center;text-align:right;
}
.order-params__note strong{color:var(--blue-ink)}
.order-params__item--static .order-params__static{
  font-size:15px;font-weight:700;color:var(--blue-ink);padding:8px 0;
}
.order-params__spacer{flex:1}

/* Сегментированный переключатель группы продукции */
.seg{display:inline-flex;border:1.5px solid var(--gray-200);border-radius:10px;overflow:hidden}
.seg__btn{
  padding:8px 16px;border:none;background:var(--white);cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;color:var(--gray-600);
  transition:background .15s ease,color .15s ease;
}
.seg__btn + .seg__btn{border-left:1.5px solid var(--gray-200)}
.seg__btn:hover{background:var(--blue-soft)}
.seg__btn.is-active{background:var(--blue);color:#fff}
/* v2.2 (превью): «Тип» — выделенный сегмент справа от даты */
.seg--type{border-color:var(--blue)}
.seg--type .seg__btn{color:var(--blue)}
.seg--type .seg__btn.is-active{background:var(--blue);color:#fff}

/* Скидка в карточке товара и возвраты в заказе */
.price-disc{font-size:11px;font-weight:600;color:var(--gray-600);margin-top:1px}
.price-disc--promo{color:#C62828;font-weight:700}
.ret-badge{
  display:inline-block;padding:1px 7px;border-radius:6px;
  background:#FDECEC;color:#A32020;font-size:12px;font-weight:600;
}

@media (max-width:820px){
  .order-params{gap:12px}
  .order-params__item{width:100%}
  .order-params__select{width:100%;min-width:0}
  .order-params__note{margin-left:0;text-align:left;width:100%}
  .seg{width:100%}
  .seg__btn{flex:1}
}

/* v2.1: экран параметров заказа — получатель/дата/заморозка до открытия прайс-листа */
.setup-card{max-width:640px}
.setup-steps{display:flex;flex-direction:column;gap:20px;margin-bottom:20px}
.setup-step{display:flex;align-items:flex-start;gap:14px}
.setup-step__num{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;
  background:var(--blue);color:#fff;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.setup-step__body{flex:1;min-width:0}
.setup-step__label{
  display:block;font-size:13px;font-weight:700;color:var(--blue-ink);
  margin-bottom:8px;
}
.setup-step__static{font-size:15px;font-weight:600;color:var(--blue-ink)}
.setup-step--static{padding-left:42px}
.setup-select-wrap{position:relative;max-width:420px}
.setup-select{
  width:100%;padding:10px 40px 10px 14px;border:1.5px solid var(--gray-200);
  border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;
  color:var(--blue-ink);background:var(--white);cursor:pointer;appearance:none;
  -webkit-appearance:none;-moz-appearance:none;
}
.setup-select:focus{outline:none;border-color:var(--blue)}
.setup-select-wrap__chevron{
  position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(90deg);
  color:var(--gray-600);pointer-events:none;
}
.setup-toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.setup-toggle input{position:absolute;opacity:0;width:1px;height:1px}
.setup-toggle__box{
  width:22px;height:22px;border-radius:6px;border:1.5px solid var(--gray-200);
  background:var(--white);flex-shrink:0;position:relative;
  transition:background .15s ease,border-color .15s ease;
}
.setup-toggle input:checked + .setup-toggle__box{background:var(--blue);border-color:var(--blue)}
.setup-toggle input:checked + .setup-toggle__box::after{
  content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.setup-toggle input:focus-visible + .setup-toggle__box{outline:2px solid var(--blue);outline-offset:2px}
.setup-toggle__text{font-size:14px;font-weight:600;color:var(--blue-ink)}
.setup-repeat{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--blue-soft);border:1px dashed var(--blue-line);
  border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;
}
.setup-repeat__text{font-size:13px;color:var(--gray-600)}
.setup-repeat__text strong{color:var(--blue-ink)}
.setup-actions{display:flex;justify-content:flex-end}
@media (max-width:640px){
  .setup-repeat{flex-direction:column;align-items:stretch;text-align:left}
  .setup-actions{justify-content:stretch}
  .setup-actions .btn{width:100%;justify-content:center}
}

/* v2.2: категории — строка чипсов над каталогом (вместо боковой панели фильтров) */
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.cat-chip{
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;
  padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;
  border:1.5px solid var(--gray-200);color:var(--gray-600);
  background:var(--white);transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.cat-chip:hover{border-color:var(--blue)}
.cat-chip.is-active{border-color:transparent;background:var(--blue-soft);color:var(--blue)}
.cat-chip.is-empty{opacity:.45}
.cat-chip input{position:absolute;opacity:0;width:1px;height:1px}
.cat-chip__check{display:inline-flex;line-height:0;color:var(--blue)}
.cat-chip--all{font-family:inherit;background:var(--gray-50);border-color:var(--gray-200);color:var(--gray-600)}
.cat-chip--all.is-active{background:var(--yellow);border-color:transparent;color:var(--blue-ink)}

/* Шапка каталога и поиск */
.catalog-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.catalog-search{
  flex:0 1 280px;min-width:170px;padding:8px 12px;

  font-family:inherit;font-size:14px;
}

/* Дополнения сводки */
.summary__addr{font-size:12px;color:var(--gray-600);margin-top:3px;line-height:1.4}
.summary__min-line{font-size:13px;margin-top:8px;color:var(--gray-600)}
.summary__note--info{
  background:var(--blue-soft);color:var(--blue-ink);
  border-radius:8px;padding:9px 11px;margin:0 0 14px;line-height:1.45;
}

/* Примечание в форме */
.summary__note{

}

/* Pill для договора в профиле */
.pill--ok{background:#E7F5E9;color:#1B5E20;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.pill--stop{background:#FDECEA;color:#8A1B14;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}

/* Демо-кнопки в форме входа */

   v1.6-B: История заказов — card-layout для мобильных <768px
   ============================================================ */
/* v2.2: подсказка про 14-дневное окно истории заказов (ТЗ ver.3) */

.order-card{

  padding:14px;cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .05s;
}
.order-card:hover{border-color:var(--blue-line);box-shadow:0 2px 8px rgba(15,49,113,.06)}
.order-card:active{transform:scale(.995)}
.order-card__top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.order-card__num{font-size:15px;color:var(--blue-ink)}

}

.order-card__sum{font-size:16px;color:var(--blue-ink)}

/* ============================================================
   v1.6-A: Каталог — card-layout для мобильных <820px
   ============================================================ */
@media (max-width:820px){
  /* v1.7: sticky-шапка с подписями колонок qty. Выровнена внутренними паддингами карточки (padding:12px в .product), поэтому такой же padding:12px */
  .product-list-header{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    padding:8px 12px;
    background:var(--blue-soft);
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    font-size:10px;font-weight:700;color:var(--blue-ink);
    text-transform:uppercase;letter-spacing:.4px;
    position:sticky;top:56px;z-index:5;
    margin-bottom:8px;
  }
  /* Наименование и Цена не нужны на мобилке (они в теле карточки) */
  .plh__name,.plh__price{display:none}
  .plh__col{width:auto;margin-left:0 !important;text-align:center;padding:0}

  /* Строка товара → карточка в 2 строки: инфа сверху, qty снизу */
  .product{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "info  price"
      "qty   qty";
    gap:8px 12px;
    padding:12px;
    border:1px solid var(--gray-200);
    border-radius:12px;
    margin-bottom:8px;
  }
  .product:hover{background:var(--white)} /* убираем hover-фон на touch */
  .product > *:first-child{grid-area:info;min-width:0}
  /* блок цены — второй div (min-width:120px) */
  .product > *:nth-child(2){grid-area:price;text-align:right;min-width:0}
  /* qty — третий div (.qty--lotonly) */
  .product .qty--lotonly{
    grid-area:qty;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
    gap:8px;
    width:100%;
  }
  /* Отменяем grid-column:3 для 2col — колонки всегда ровные 3, empty остаётся в центре */
  .product .qty--lotonly.qty--2col .qty__field:last-child{grid-column:auto}
  .product .qty--lotonly .qty__stepper,
  .product .qty--lotonly .qty__total{
    width:100%;
    height:44px; /* touch target */
  }
  .product .qty--lotonly .qty__stepper .qty__btn{
    width:44px;
    font-size:20px;
  }
  .product .qty--lotonly .qty__stepper input{
    font-size:16px; /* iOS: >=16 отключает zoom при фокусе */
  }
  .product .qty--lotonly .qty__total{font-size:16px}

  /* Название товара — переносится, не обрезается */
  .product__name{
    white-space:normal !important;
    overflow:visible !important;
    text-overflow:clip !important;
    font-size:14px;
    line-height:1.35;
  }

  /* v1.5.4 sticky-header каталога отменяет max-height, вернём scroll на весь viewport */
  .product-list{max-height:none;border:none;padding:0}

  /* Отключаем правила из старого @media 768 которые ломают grid */
  .product{flex-wrap:initial}
}

/* ============================================================
   v1.7-C: Модалки fullscreen на узких экранах <600px
   ============================================================ */
@media (max-width:600px){
  .modal-back,.confirm-back{padding:0}
  .modal{
    max-width:100%;width:100%;max-height:100vh;height:100vh;
    border-radius:0;overflow-y:auto;
  }
  .modal__header{
    border-radius:0;
    position:sticky;top:0;z-index:2;

  }
  .modal__header h3{font-size:16px}
  .modal__body{padding:16px}
  .confirm-modal{
    max-width:100%;width:100%;border-radius:0;
    height:auto;max-height:100vh;margin:auto 0;
  }
}

  var CATALOG = PRODUCTS.map(function(p, i){
