<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КАРАВАЙ · Кабинет менеджера</title><link rel="stylesheet" href="styles.css"><script src="app.js?v=0.6.0" defer></script></head><body>
<div id="login" class="login"><form id="login-form"><img src="logo.svg" alt="КАРАВАЙ"><h1>Кабинет менеджера</h1><p>Управление покупателями, получателями и доступом</p><label>Email<input name="identity" type="email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form></div>
<div id="workspace" hidden><aside><img src="logo.svg" alt="КАРАВАЙ"><span class="badge">Кабинет менеджера · 0.6</span><nav><button data-tab="payers">Покупатели</button><button data-tab="users">Пользователи</button><button data-tab="clients">Получатели</button></nav><a href="/">Кабинет клиента ↗</a><button id="logout">Выйти</button></aside><main><header><div><span id="who"></span><h1 id="title">Покупатели</h1></div><button id="refresh">Обновить</button></header><div class="toolbar"><input id="search" type="search" autocomplete="off" placeholder="Поиск по имени, коду или email" aria-label="Поиск"><button id="create">Добавить покупателя</button></div><section id="content"></section><footer>Данные PocketBase и КИС · изменения проверяются сервером</footer></main></div>
<dialog id="dialog"><form id="editor"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="Закрыть">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">Отмена</button><button id="save">Сохранить</button></div></form></dialog><div id="message" role="status" hidden></div>
</body></html>
