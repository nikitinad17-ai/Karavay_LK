      if(e instanceof ApiError)throw e;

    <form id="login-form" autocomplete="on"><div class="login__field"><label for="identity">Электронная почта</label><input id="identity" name="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required value="${E(state.loginEmail)}" placeholder="name@company.ru" ${state.loginBusy?'disabled':''}></div>
    <div class="login__field"><label for="password">Пароль</label><div class="password-wrap"><input id="password" name="password" type="${state.showPassword?'text':'password'}" autocomplete="current-password" required placeholder="Введите пароль" ${state.loginBusy?'disabled':''}><button type="button" class="icon-button password-toggle" data-action="toggle-password" aria-label="Показать пароль" aria-pressed="false">${icon('eye')}</button></div><span class="caps-hint" id="caps-hint" hidden>Включён Caps Lock</span></div>
    <button class="login__submit" type="submit" ${state.loginBusy||location.protocol==='file:'?'disabled':''}>${state.loginBusy?'Проверяем доступ…':'Войти в кабинет'}${!state.loginBusy?icon('arrow',18):''}</button></form>
    <details class="login-help"><summary>Не получается войти?</summary><p>Проверьте раскладку и Caps Lock. Нужен пароль пользователя личного кабинета, не администратора. Для восстановления доступа обратитесь к вашему менеджеру или администратору.</p></details>
    <div class="access-footnote">${icon('lock',16)}<span>${isTest?'Тестовая версия. ':''}Сейчас доступны каталог и история. Отправка заказов пока отключена.</span></div></div></section></main>`;}
  function payerSelectionMarkup(){return `<main class="buyer-select-page"><section class="buyer-select-card"><img class="buyer-select-logo" src="${LOGO}" alt="КАРАВАЙ"><div class="eyebrow">ВАШ ЛИЧНЫЙ КАБИНЕТ</div><h1>С каким юрлицом работаем?</h1><p class="buyer-select-lead">${E(state.user?.name||'')}, выберите компанию. Список содержит только назначенные вам плательщики.</p><div class="payer-cards">${state.payers.map(p=>`<button class="payer-choice" data-payer="${p.id}"><span class="payer-symbol">${icon('building',24)}</span><span><strong>${E(p.name)}</strong><small>${p.access==='all'?'Все разрешённые получатели':'Назначенные получатели'}</small></span>${icon('arrow')}</button>`).join('')}</div><button class="btn btn--secondary" data-action="logout">${icon('logout',16)} Выйти</button></section></main>`;}
  function navMarkup(compact=false){return navItems.map(([key,label])=>`<a href="#${key}" data-route="${key}" class="${state.route===key?'active':''}" ${state.route===key?'aria-current="page"':''}>${icon(key,compact?21:19)}<span>${E(compact?({order:'Каталог',orders:'Заказы'}[key]||label):label)}</span></a>`).join('');}
  function shellMarkup(){return `<div class="app"><a class="skip-link" href="#page-content">Перейти к содержимому</a><aside class="sidebar"><div class="sidebar__logo"><img class="sidebar__logo-img" src="${LOGO}" alt="КАРАВАЙ"/><div><div class="sidebar__logo-title">КАРАВАЙ</div><div class="sidebar__logo-sub">Кабинет партнёра</div></div></div><div class="sidebar-section-label">ВАШ КАБИНЕТ</div><nav class="sidebar__nav" aria-label="Основная навигация">${navMarkup()}</nav><div class="sidebar__foot"><div class="sidebar__contact"><span class="live-dot"></span><strong>${isTest?'Тестовый контур':'Режим просмотра'}</strong><p>Каталог и история из КИС.<br>Отправка заказов отключена.</p><span class="version">Версия ${VERSION}</span></div><button data-action="logout" type="button">${icon('logout',17)} Выйти из кабинета</button></div></aside>
    <div class="main"><header class="topbar"><div class="topbar-location"><small>Кабинет партнёра</small><h1 class="topbar__title">${E(routeLabel())}</h1></div><div class="topbar__spacer"></div><div class="buyer-switcher"><label for="payer-switch">Юридическое лицо</label><select id="payer-switch" data-payer-select>${state.payers.map(p=>`<option value="${p.id}" ${p.id===state.payerId?'selected':''}>${E(p.name)}</option>`).join('')}</select></div><button class="topbar__user" data-route="profile" title="Открыть профиль"><span class="avatar">${E((state.user?.name||state.email||'К').trim().charAt(0).toUpperCase())}</span><span><strong class="topbar__user-name">${E(state.user?.name||'Пользователь')}</strong><small class="topbar__user-code">${E(roleLabel(state.user?.role))}</small></span></button></header>
    <main class="content" id="page-content" tabindex="-1">${pageMarkup()}</main><footer class="app-footer"><span>ОАО «КАРАВАЙ» · Санкт-Петербург</span><span>Личный кабинет ${VERSION} · только чтение</span></footer></div><nav class="mobile-bottom-nav" aria-label="Разделы кабинета">${navMarkup(true)}</nav></div>${state.modal?modalMarkup():''}`;}
  function statsMarkup(){return `<div class="stats-grid">${[
    ['outlets','Доступные получатели',state.clientsLoaded?num(state.clients.length)+(state.hasMore?'+':''):'—',state.hasMore?'Есть следующая порция':state.clientsLoaded?'В текущем юридическом лице':'Загружаем список'],
    ['box','Товары получателя',state.catalog===null?'—':num(state.catalog.length),state.catalog===null?'Откройте каталог для загрузки':'В последнем ответе КИС'],
    ['orders','Заказы получателя',state.orders===null?'—':num(state.orders.length),state.orders===null?'Откройте историю для загрузки':'В текущей выдаче КИС'],
  ].map(([ic,title,val,hint])=>`<section class="stat-card"><div class="stat-heading"><span>${E(title)}</span><span class="stat-icon">${icon(ic,21)}</span></div><strong class="stat-value">${E(val)}</strong><small>${E(hint)}</small></section>`).join('')}</div>`;}
  function dashboardMarkup(){return `<section class="hero-card"><div><div class="eyebrow light">НА СВЯЗИ С КАРАВАЕМ</div><h2>Ваш бизнес.<br><span>Ваш личный кабинет.</span></h2><p>${E(payer()?.name||'')} · ${E(roleLabel(state.user?.role))}</p><div class="actions"><button class="btn btn--primary" data-route="order">Открыть каталог ${icon('arrow',18)}</button><button class="btn btn--ghost" data-route="outlets">Мои получатели</button></div></div><div class="hero-brand" aria-hidden="true"><img src="${LOGO}" alt=""/></div></section>
    ${state.clientError?banner('Не удалось загрузить получателей',state.clientError,'error','reload-clients'):''}${statsMarkup()}
    <div class="dashboard-grid"><section class="card selected-card"><div class="section-eyebrow">РАБОЧИЙ КОНТЕКСТ</div><h3>Выбранное юридическое лицо</h3><div class="selected-company">${icon('building',24)}<strong>${E(payer()?.name||'')}</strong></div><span class="badge neutral">${payer()?.access==='all'?'Все разрешённые получатели':'Назначенные получатели'}</span>${clientSelectorMarkup()}<div class="context-id">${client()?`Код получателя: ${E(client().code||'—')} · ID КИС: ${client().id}`:'Выберите получателя, чтобы открыть его каталог и историю.'}</div><button class="text-button" data-route="outlets">Все получатели ${icon('arrow',16)}</button></section>
    <section class="card quick-card"><div class="section-eyebrow">БЫСТРЫЙ ДОСТУП</div><h3>Что нужно сегодня?</h3><button class="quick-link" data-route="order"><span class="quick-symbol">${icon('box',23)}</span><span><strong>Посмотреть ассортимент</strong><small>Поиск по названию и коду товара</small></span>${icon('chevron',18)}</button><button class="quick-link" data-route="orders"><span class="quick-symbol">${icon('orders',23)}</span><span><strong>Найти заказ</strong><small>Данные последней выдачи КИС</small></span>${icon('chevron',18)}</button><button class="quick-link" data-route="profile"><span class="quick-symbol">${icon('profile',23)}</span><span><strong>Проверить свой доступ</strong><small>Учётная запись и юридические лица</small></span>${icon('chevron',18)}</button></section></div>
    ${banner('Доступно для просмотра','Цены, оформление заказов и документы подключаются отдельно. Сейчас кабинет не создаёт и не изменяет заказы.')}`;}
  function searchBox(id,value,placeholder){return `<label class="search-box">${icon('search',19)}<span class="sr-only">${E(placeholder)}</span><input id="${id}" type="search" value="${E(value)}" placeholder="${E(placeholder)}" autocomplete="off"><span class="search-shortcut" aria-hidden="true">/</span></label>`;}
  function recipientsList(){const values=state.clients.filter(c=>matches([c.name,c.code,c.address,c.id],state.recipientSearch));return `${values.length?`<div class="recipient-list">${values.map(c=>`<article class="recipient-item ${c.id===state.selectedClientId?'selected':''}"><div class="recipient-symbol">${icon('outlets',24)}</div><div class="recipient-data"><strong>${E(c.name)}</strong><p>${E(c.address||'Адрес не предоставлен')}</p><small>Код: ${E(c.code||'—')} <span>·</span> ID КИС: ${c.id}</small></div><div class="recipient-actions"><button class="btn ${c.id===state.selectedClientId?'btn--selected':'btn--secondary'} btn--sm" data-client-id="${c.id}" ${c.id===state.selectedClientId?'disabled':''}>${c.id===state.selectedClientId?icon('check',16)+' Выбран':'Выбрать'}</button><button class="text-button" data-show-catalog="${c.id}">Каталог ${icon('arrow',16)}</button></div></article>`).join('')}</div>`:!state.clientsLoading?empty('outlets',state.recipientSearch?'Получатели не найдены':'В текущей выдаче нет получателей',state.hasMore?'Загрузите следующую порцию — в ней могут быть доступные получатели.':'Попробуйте другой запрос или обновите список.'):''}<div class="list-footer"><span>${state.recipientSearch?`Найдено ${values.length} среди ${state.clients.length} загруженных`:`${countText(state.clients.length,['получатель','получателя','получателей'])} загружено`}</span>${state.hasMore?`<button class="btn btn--secondary" data-action="more-clients" ${state.clientsLoading?'disabled':''}>${state.clientsLoading?'Загружаем…':'Загрузить ещё'} ${icon('arrow',16)}</button>`:'<span class="subtle">Конец текущей выдачи</span>'}</div>`;}
  function recipientsMarkup(){return `${intro('ДОСТАВКА','Получатели','Выбирайте точку для просмотра её ассортимента и заказов.')}${state.clientError?banner('Ошибка загрузки',state.clientError,'error','reload-clients'):''}<section class="card"><div class="section-toolbar"><div><h3>Ваши получатели</h3>${updated(state.clientsAt)}</div><button class="btn btn--secondary btn--sm" data-action="reload-clients" ${state.clientsLoading?'disabled':''}>${icon('refresh',16)} Обновить</button></div>${searchBox('recipient-search',state.recipientSearch,'Название, код или адрес получателя')}${state.clientsLoading?loading('Получаем следующую порцию из КИС…'):''}<div id="recipients-list">${recipientsList()}</div></section>`;}
  function priceValue(v){if(v==null)return null;if(typeof v==='number'&&Number.isFinite(v)&&v>=0)return v;throw new ApiError(502,'INVALID_PRODUCT');}
  function catalogFiltered(){let items=(state.catalog||[]).filter(p=>matches([p.name,p.kod,p.id],state.catalogSearch));if(state.catalogSort==='name')items.sort((a,b)=>a.name.localeCompare(b.name,'ru',{numeric:true}));if(state.catalogSort==='code')items.sort((a,b)=>a.kod.localeCompare(b.kod,'ru',{numeric:true}));if(state.catalogSort==='weight')items.sort((a,b)=>(a.weight??Infinity)-(b.weight??Infinity));return items;}
  function catalogRows(){
    const values=catalogFiltered(),pages=Math.max(1,Math.ceil(values.length/state.catalogPageSize));state.catalogPage=Math.min(Math.max(1,state.catalogPage),pages);const start=(state.catalogPage-1)*state.catalogPageSize,part=values.slice(start,start+state.catalogPageSize);
    return `<div class="results-line" aria-live="polite"><span>${state.catalogSearch?'По вашему запросу':'В ассортименте'} <strong>${countText(values.length,['товар','товара','товаров'])}</strong></span><span>${values.length?`${start+1}–${start+part.length} из ${values.length}`:'0 результатов'}</span></div>${values.length?`<div class="table-wrapper catalog-table-wrap"><table class="table data-table catalog-table"><caption class="sr-only">Товары выбранного получателя</caption><thead><tr><th>Товар / код</th><th>Вес <span title="Поле weight КИС. Единица измерения требует уточнения.">КИС</span></th><th title="Поле kol_sht. Значение не используется как минимум или кратность заказа.">Кол-во КИС</th><th title="Поле shelf_life. Единица измерения требует уточнения.">Срок хранения</th><th>Цена</th><th><span class="sr-only">Подробнее</span></th></tr></thead><tbody>${part.map(p=>`<tr><td class="product-main" data-label="Товар"><button class="product-link" data-product="${p.id}">${E(p.name)}</button><div class="product-meta">Код <strong>${E(p.kod)}</strong><span>·</span><span>ID ${p.id}</span></div></td><td data-label="Вес КИС">${num(p.weight)}</td><td data-label="Кол-во КИС">${num(p.kol_sht)}</td><td data-label="Срок хранения">${typeof p.shelf_life==='number'?num(p.shelf_life):E(p.shelf_life??'—')}</td><td data-label="Цена" class="money" title="Цена КИС на выбранную дату">${money(p.cenaotp)}</td><td class="row-action"><button class="icon-button" data-product="${p.id}" aria-label="Подробнее о товаре ${E(p.kod)}">${icon('chevron',18)}</button></td></tr>`).join('')}</tbody></table></div>`:empty('search','Ничего не найдено','Попробуйте часть названия, код или ID товара.')}
    <div class="pagination"><span>Страница ${state.catalogPage} из ${pages}</span><div><button class="btn btn--secondary btn--sm" data-action="page-first" ${state.catalogPage===1?'disabled':''} aria-label="Первая страница">В начало</button><button class="icon-button" data-action="page-prev" ${state.catalogPage===1?'disabled':''} aria-label="Предыдущая страница">${icon('left',18)}</button><span class="current-page">${state.catalogPage}</span><button class="icon-button" data-action="page-next" ${state.catalogPage===pages?'disabled':''} aria-label="Следующая страница">${icon('chevron',18)}</button><button class="btn btn--secondary btn--sm" data-action="page-last" ${state.catalogPage===pages?'disabled':''} aria-label="Последняя страница">В конец</button></div></div>`;
  }
  function catalogMarkup(){return `${intro('АССОРТИМЕНТ','Каталог товаров','Реальный ассортимент для выбранного получателя. Найдите нужное по названию или коду.')}${contextCard('reload-catalog','Обновить каталог',state.catalogLoading)}<div class="card catalog-controls" style="margin-top:12px"><label class="context-select">Дата заказа (Санкт-Петербург)<input id="catalog-date" type="date" min="2000-01-01" max="2099-12-31" value="${E(state.catalogDate)}" ${state.catalogLoading?'disabled':''} style="display:block;padding:10px;border:1px solid #dbe4ee;border-radius:9px;font:inherit"></label><label class="context-select">Продукция<select id="catalog-group" ${state.catalogLoading?'disabled':''}><option value="1" ${state.catalogGroup==='1'?'selected':''}>ХБИ и прочая продукция</option><option value="0" ${state.catalogGroup==='0'?'selected':''}>ЗПФ</option></select></label></div><div class="capability-line"><span class="badge amber">${icon('info',14)} Только просмотр</span><span>Цены КИС на выбранную дату. Добавление товаров в заказ пока недоступно.</span></div>${state.catalogError?banner('Каталог недоступен',state.catalogError,'error','reload-catalog'):''}${selectedHint()}${state.catalogLoading?`<div class="card skeleton-card">${loading('Загружаем ассортимент…')}<div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>`:''}
    ${state.catalog!==null?`<section class="card catalog-card"><div class="section-toolbar"><div><h3>${E(client()?.name||'')}</h3>${updated(state.catalogAt)}</div><span class="badge neutral">КИС · ${countText(state.catalog.length,['товар','товара','товаров'])}</span></div><div class="catalog-controls">${searchBox('catalog-search',state.catalogSearch,'Название, код или ID товара')}<label class="sort-control"><span class="sr-only">Сортировка товаров</span><select id="catalog-sort" aria-label="Сортировка товаров">${[['source','Порядок КИС'],['name','По названию'],['code','По коду'],['weight','По весу']].map(([v,t])=>`<option value="${v}" ${state.catalogSort===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="sort-control"><span class="sr-only">Товаров на странице</span><select id="catalog-page-size" aria-label="Товаров на странице">${[25,50,100].map(v=>`<option value="${v}" ${state.catalogPageSize===v?'selected':''}>По ${v}</option>`).join('')}</select></label></div><div id="catalog-rows">${catalogRows()}</div><div class="data-note">${icon('info',15)} Вес, количество и срок хранения показаны как в ответе КИС. Единицы и смысл количества уточняются; расчёт заказа по ним не выполняется.</div></section>`:''}`;}
  function filteredOrders(){const values=(state.orders||[]).filter(o=>matches([o.id,o.order_number,o.state,dateText(o.order_date)],state.orderSearch));values.sort((a,b)=>{if(state.orderSort==='number')return String(a.order_number??'').localeCompare(String(b.order_number??''),'ru',{numeric:true});return ((dateValue(b.order_date)||0)-(dateValue(a.order_date)||0))*(state.orderSort==='date-asc'?-1:1);});return values;}
  function ordersRows(){const values=filteredOrders();return `${values.length?`<div class="table-wrapper"><table class="table data-table orders-table"><caption class="sr-only">История заказов выбранного получателя</caption><thead><tr><th>Заказ</th><th>Дата</th><th>Количество</th><th>Сумма</th><th>Статус</th><th><span class="sr-only">Сведения</span></th></tr></thead><tbody>${values.map(o=>`<tr><td data-label="Заказ"><button class="product-link" data-order="${o.id}">№ ${E(o.order_number??'—')}</button><div class="product-meta">ID ${o.id}</div></td><td data-label="Дата">${E(dateText(o.order_date))}</td><td data-label="Количество">${typeof o.kol_sht==='number'?num(o.kol_sht):E(o.kol_sht??'—')}</td><td data-label="Сумма" class="money">${money(o.sum_all)}</td><td data-label="Статус"><span class="badge neutral" title="Расшифровка статусов пока не подтверждена">${o.state==null?'Не указан':'Код КИС: '+E(o.state)}</span></td><td class="row-action"><button class="icon-button" data-order="${o.id}" aria-label="Сведения о заказе ${E(o.order_number??o.id)}">${icon('chevron',18)}</button></td></tr>`).join('')}</tbody></table></div>`:empty('orders',state.orderSearch?'Заказ не найден':'Пока нет заказов в текущей выдаче',state.orderSearch?'Попробуйте другой номер или ID.':'КИС не вернула записи для выбранного получателя. Это не означает отсутствия заказов за все периоды.')}`;}
  function ordersMarkup(){return `${intro('ВАШИ ЗАКАЗЫ','История заказов','Номера, даты и суммы из КИС. Сейчас доступен просмотр без изменения заказов.')}${contextCard('reload-orders','Обновить историю',state.ordersLoading)}${state.ordersError?banner('История недоступна',state.ordersError,'error','reload-orders'):''}${selectedHint()}${state.ordersLoading?`<div class="card">${loading('Запрашиваем историю заказов…')}</div>`:''}${state.orders!==null?`<section class="card"><div class="section-toolbar"><div><h3>${countText(state.orders.length,['заказ','заказа','заказов'])}</h3><p class="section-sub">${E(client()?.name||'')}</p></div>${updated(state.ordersAt)}</div>${state.orders.length?`<div class="catalog-controls">${searchBox('orders-search',state.orderSearch,'Номер, ID или код статуса заказа')}<label class="sort-control"><span class="sr-only">Сортировка заказов</span><select id="orders-sort" aria-label="Сортировка заказов">${[['date-desc','Сначала новые'],['date-asc','Сначала старые'],['number','По номеру']].map(([v,t])=>`<option value="${v}" ${state.orderSort===v?'selected':''}>${t}</option>`).join('')}</select></label></div>`:''}<div id="orders-rows">${ordersRows()}</div><div class="data-note">${icon('info',15)} Показана текущая выдача КИС. Значения статусов сохранены как коды — их расшифровка ещё не согласована.</div></section>`:''}`;}
  function documentsMarkup(){return `${intro('ДОКУМЕНТООБОРОТ','Документы','Место для документов вашего юридического лица.')}<div class="document-grid">${[['Договоры','Условия сотрудничества'],['Счета и акты','Документы по заказам'],['Прайс-листы','Актуальные коммерческие условия']].map(([t,s])=>`<section class="card document-card"><span class="document-icon">${icon('documents',30)}</span><h3>${t}</h3><p>${s}</p><span class="badge neutral">Не подключено</span></section>`).join('')}</div>${banner('Документы пока недоступны','Раздел появится после подключения документального сервиса. Для получения документов обратитесь к вашему менеджеру. Демо-файлы не используются.')}`;}
  function profileMarkup(){const d=state.lastDiagnostic;return `${intro('УЧЁТНАЯ ЗАПИСЬ','Ваш профиль','Доступ и информация о текущей сессии.')}<div class="dashboard-grid"><section class="card"><div class="profile-person"><span class="avatar large">${E((state.user?.name||state.email||'К').charAt(0))}</span><div><h3>${E(state.user?.name||'Пользователь')}</h3><span class="badge neutral">${E(roleLabel(state.user?.role))}</span></div></div><dl class="profile-grid"><dt>Почта</dt><dd>${E(state.email||'—')}</dd><dt>Режим кабинета</dt><dd>Каталог и история · чтение</dd><dt>Версия</dt><dd>${VERSION}</dd></dl><button class="btn btn--secondary" data-action="logout">${icon('logout',16)} Выйти из кабинета</button></section><section class="card"><h3>Доступные юридические лица</h3>${state.payers.map(p=>`<div class="profile-access"><strong>${E(p.name)}</strong><span>${p.access==='all'?'Все разрешённые получатели':'Назначенные получатели'}</span></div>`).join('')}<button class="btn btn--secondary btn--sm" data-action="reload-access">${icon('refresh',15)} Обновить доступ</button></section></div><details class="card diagnostic"><summary>Сведения для поддержки ${icon('info',16)}</summary><dl class="profile-grid"><dt>Плательщик PB</dt><dd>${E(state.payerId||'—')}</dd><dt>Получатель КИС</dt><dd>${state.selectedClientId||'—'}</dd><dt>Последний запрос</dt><dd><code>${E(d?.path||'—')}</code></dd><dt>HTTP</dt><dd>${d?d.status:'—'}</dd><dt>Время</dt><dd>${E(timeText(d?.at))}</dd></dl><p class="muted fine">Пароли и токены здесь не отображаются. ID позволяют сверить, для какого получателя запрошены данные.</p></details>${banner('Нужна помощь с учётной записью?','Изменение профиля и восстановление пароля через кабинет пока не подключены. Обратитесь к администратору.')}`;}
  function pageMarkup(){return state.route==='dashboard'?dashboardMarkup():state.route==='outlets'?recipientsMarkup():state.route==='order'?catalogMarkup():state.route==='orders'?ordersMarkup():state.route==='documents'?documentsMarkup():profileMarkup();}
  function modalMarkup(){
    let title='',eyebrow='',content='';
    if(state.modal?.kind==='product'){
      const p=state.catalog?.find(p=>p.id===state.modal.id);if(!p)return '';
      title=p.name;eyebrow='КАРТОЧКА ТОВАРА';content=`<div class="modal-product-meta"><span class="badge neutral">Код ${E(p.kod)}</span><span class="muted">ID КИС: ${p.id}</span></div><dl class="detail-grid"><dt>Вес (значение КИС)</dt><dd>${num(p.weight)}</dd><dt>Количество (kol_sht)</dt><dd>${num(p.kol_sht)}</dd><dt>Срок хранения</dt><dd>${typeof p.shelf_life==='number'?num(p.shelf_life):E(p.shelf_life??'—')}</dd><dt>Цена на выбранную дату</dt><dd>${money(p.cenaotp)}</dd><dt>Базовая цена КИС</dt><dd>${money(p.basecenaotp)}</dd><dt>Скидка КИС, %</dt><dd>${num(p.procskd)}</dd><dt>Минимум КИС</dt><dd>${num(p.kolshtordmin)}</dd><dt>Дата заказа</dt><dd>${E(state.catalogDate)}</dd><dt>Получатель</dt><dd>${E(client()?.name||'—')}</dd></dl>${banner('Только просмотр','Единицы измерения и назначение kol_sht уточняются. Создание заказа и расчёт стоимости пока недоступны.')}`;
    }else{
      const o=state.orders?.find(o=>o.id===state.modal?.id);if(!o)return '';
      title='Заказ № '+(o.order_number??'—');eyebrow='СВЕДЕНИЯ ИЗ ИСТОРИИ';content=`<div class="modal-product-meta"><span class="badge neutral">${o.state==null?'Статус не указан':'Код КИС: '+E(o.state)}</span><span class="muted">ID: ${o.id}</span></div><dl class="detail-grid"><dt>Дата заказа</dt><dd>${E(dateText(o.order_date))}</dd><dt>Создан</dt><dd>${E(dateText(o.create_date))}</dd><dt>Количество</dt><dd>${typeof o.kol_sht==='number'?num(o.kol_sht):E(o.kol_sht??'—')}</dd><dt>Сумма</dt><dd class="money">${money(o.sum_all)}</dd><dt>Получатель</dt><dd>${E(client()?.name||'—')}</dd></dl>${banner('Состав заказа не загружен','Здесь показаны только сведения из списка заказов. Детализация позиций, изменение и удаление пока не подключены.')}`;
    }
    return `<dialog id="details-dialog" aria-labelledby="details-title"><div class="dialog-top"><div class="eyebrow">${eyebrow}</div><button class="icon-button" data-action="close-modal" aria-label="Закрыть сведения">${icon('close')}</button></div><h2 id="details-title">${E(title)}</h2>${content}<div class="dialog-footer"><button class="btn btn--secondary" data-action="close-modal">Закрыть</button></div></dialog>`;
  }
  function render(){
    const focused=document.activeElement,id=focused?.id,selection=id&&typeof focused.selectionStart==='number'?[focused.selectionStart,focused.selectionEnd]:null;
    if(state.initializing){app.innerHTML=`<main class="loading-page"><div class="loading-card"><img src="${LOGO}" width="84" height="84" alt="КАРАВАЙ"><h2>Открываем кабинет</h2><p>Проверяем сессию и права доступа</p><span class="spinner"></span></div></main>`;return;}
    app.innerHTML=!state.token||!state.user?loginMarkup():!state.payerId?payerSelectionMarkup():shellMarkup();
    if(state.modal){const dialog=document.getElementById('details-dialog');if(dialog){dialog.showModal();dialog.addEventListener('cancel',e=>{e.preventDefault();closeModal();});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});}}
    else if(id&&id!=='password'){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});if(selection&&el.setSelectionRange)try{el.setSelectionRange(...selection);}catch{}}}
  }
  function closeModal(){const focus=state.focusReturn;state.modal=null;render();if(focus){const el=app.querySelector(focus);el?.focus({preventScroll:true});}}
  function openModal(kind,id){if(!validKIS(id))return;state.focusReturn=kind==='product'?`[data-product="${id}"]`:`[data-order="${id}"]`;state.modal={kind,id};render();}
  function updateCatalogRows(){const el=document.getElementById('catalog-rows');if(el)el.innerHTML=catalogRows();}
  app.addEventListener('submit',e=>{if(e.target?.id!=='login-form')return;e.preventDefault();const email=e.target.querySelector('#identity')?.value.trim()||'',pw=e.target.querySelector('#password')?.value||'';if(email&&pw)login(email,pw);});
  app.addEventListener('click',e=>{
    const t=e.target.closest('button,a');if(!t||t.disabled)return;
    const action=t.dataset.action;
    if(action==='logout'){e.preventDefault();endSession();return;}
    if(action==='toggle-password'){const p=document.getElementById('password');if(!p)return;state.showPassword=!state.showPassword;p.type=state.showPassword?'text':'password';t.setAttribute('aria-pressed',String(state.showPassword));t.setAttribute('aria-label',state.showPassword?'Скрыть пароль':'Показать пароль');p.focus();return;}
    if(action==='reload-access'){reloadAccess();return;}
    if(action==='reload-clients'){loadClients(true);return;}
    if(action==='more-clients'){loadClients(false);return;}
    if(action==='reload-catalog'){loadCatalog();return;}
    if(action==='reload-orders'){loadOrders();return;}
    if(action==='close-modal'){closeModal();return;}
    if(action?.startsWith('page-')){
      const max=Math.max(1,Math.ceil(catalogFiltered().length/state.catalogPageSize));
      state.catalogPage=action==='page-next'?Math.min(max,state.catalogPage+1):action==='page-prev'?Math.max(1,state.catalogPage-1):action==='page-last'?max:1;updateCatalogRows();document.querySelector('.catalog-controls')?.scrollIntoView({block:'start',behavior:'instant'});return;
    }
    if(t.dataset.payer){e.preventDefault();selectPayer(t.dataset.payer);return;}
    if(t.dataset.showCatalog){e.preventDefault();state.route='order';selectClient(Number(t.dataset.showCatalog));return;}
    if(t.dataset.clientId){selectClient(Number(t.dataset.clientId));return;}
    if(t.dataset.product){openModal('product',Number(t.dataset.product));return;}
    if(t.dataset.order){openModal('order',Number(t.dataset.order));return;}
    if(t.dataset.route){e.preventDefault();navigate(t.dataset.route);}
  });
  app.addEventListener('input',e=>{
    if(e.target.id==='identity')state.loginEmail=e.target.value;
    if(e.target.id==='catalog-search'){state.catalogSearch=e.target.value;state.catalogPage=1;updateCatalogRows();}
    if(e.target.id==='recipient-search'){state.recipientSearch=e.target.value;const el=document.getElementById('recipients-list');if(el)el.innerHTML=recipientsList();}
    if(e.target.id==='orders-search'){state.orderSearch=e.target.value;const el=document.getElementById('orders-rows');if(el)el.innerHTML=ordersRows();}
  });
  app.addEventListener('change',e=>{
    const t=e.target;
    if(t.matches('[data-payer-select]'))selectPayer(t.value);
    if(t.matches('[data-client-select]')){const n=Number(t.value);if(validKIS(n))selectClient(n);else{cancelRequests();clearBusiness();state.selectedClientId=null;saveUI();render();}}
    if(t.id==='catalog-date'||t.id==='catalog-group'){
      if(state.catalogLoading)return;
      if(t.id==='catalog-date')state.catalogDate=t.value;
      else if(['0','1'].includes(t.value))state.catalogGroup=t.value;
      state.catalog=null;state.catalogAt=null;state.catalogError='';state.modal=null;
      render();loadCatalog();return;
    }
    if(t.id==='catalog-sort'&&['source','name','code','weight'].includes(t.value)){state.catalogSort=t.value;state.catalogPage=1;updateCatalogRows();}
    if(t.id==='catalog-page-size'&&[25,50,100].includes(Number(t.value))){state.catalogPageSize=Number(t.value);state.catalogPage=1;updateCatalogRows();}
    if(t.id==='orders-sort'){state.orderSort=t.value;const el=document.getElementById('orders-rows');if(el)el.innerHTML=ordersRows();}
  });
  app.addEventListener('keyup',e=>{if(e.target.id==='password'){const h=document.getElementById('caps-hint');if(h)h.hidden=!e.getModifierState('CapsLock');}});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!state.modal&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){const s=document.querySelector('input[type="search"]');if(s){e.preventDefault();s.focus();}}});
  window.addEventListener('pagehide',()=>{cancelRequests();clearBusiness();state.initializing=true;render();});
  window.addEventListener('pageshow',e=>{if(e.persisted){state.initializing=true;render();restoreSession();}});
  let accessRefreshAt=Date.now();
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&state.token&&!state.initializing&&!state.loginBusy&&Date.now()-accessRefreshAt>30000){accessRefreshAt=Date.now();reloadAccess();}
  });
  restoreSession();
})();
</script></body></html>
